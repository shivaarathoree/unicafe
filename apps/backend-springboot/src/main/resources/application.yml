server:
  port: ${PORT:8080}

spring:
  # Disable default security password generation
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}
  # Disable all MongoDB/datasource auto-configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:spatialmeet-super-secret-key-for-local-dev-min-256-bits-long-enough}
  expiration: 86400000 # 24 hours in milliseconds

# Room Configuration
room:
  max-players: 20
  max-public-rooms: 50
  inactive-timeout: 604800000 # 7 days in ms
  cleanup-interval: 3600000   # 1 hour in ms

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,https://spatialmeet-app.vercel.app}

# Logging
logging:
  level:
    root: WARN
    org.springframework: INFO
    com.spatialmeet: DEBUG
